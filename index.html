<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>To Do List</title>
</head>
<body>
    <div id="heading">
        <h1>To Do List</h1>
        <p>Add your To-Dos here. Note: They do not save when you refresh</p>
    </div>
    <div id="to-do-input">
        <label for="title-of-task">To-Do Title: </label>
        <input class="input" type="text" name="title-of-task" placeholder="give your task a title...">
        <label for="task">What should you do: </label>
        <input class="input" type="text" name="task" placeholder="The task that needs to...">
        <label for="time">When should it be done: </label>
        <input class="input" id="time" type="time" name="time">
        <button id="add-to-do">Add</button>
    </div>
    <div id="to-dos">

    </div>
</body>
</html>
