<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>To Do List</title>
</head>
<body>
    <div id="heading">
        <h1>To Do List</h1>
        <p>Add your To-Dos here. Note: They do not save when you refresh</p>
    </div>
    <div id="to-do-input">
        <span>To-Do Title: </span>
        <input class="input" type="text" placeholder="give your task a title...">
        <span>What should you do: </span>
        <input class="input" type="text" placeholder="The task that needs to...">
        <span>When should it be done: </span>
        <input class="input" type="time">
        <button id="add-to-do">Add</button>
    </div>
    <div id="to-dos">

    </div>
    <script src="script.js" type="module"></script>
</body>
</html>
